# Builds the site by itself after every change to the content or the source,
# so edits made on github.com (or by any Claude) go live without running anything by hand.
# If the build finds a mistake (e.g. in content/speakers.txt), this run fails, GitHub emails
# whoever made the change, and the live pages stay exactly as they were.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "src/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html and speakers-b663ff.html
        run: python src/build.py
      - name: Publish the built pages (only if they changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html speakers-b663ff.html
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Build pages after: $(git log -1 --format=%s HEAD)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
